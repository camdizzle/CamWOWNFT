<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Necklace Customizer</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <h1>3D Necklace Customizer</h1>
      <span class="subtitle">Design oversized pendants for 3D printing</span>
    </header>

    <div id="main-layout">
      <!-- Left Panel: Controls -->
      <aside id="controls-panel">
        <!-- Chain Upload -->
        <section class="control-group">
          <h2>Chain Template</h2>
          <div class="upload-zone" id="chain-upload-zone">
            <input type="file" id="chain-file" accept=".stl" hidden>
            <button id="chain-upload-btn" class="btn btn-secondary">Upload Chain STL</button>
            <p class="upload-hint">Drop an STL file or click to browse</p>
            <p id="chain-filename" class="filename"></p>
          </div>
        </section>

        <!-- Pendant Text -->
        <section class="control-group">
          <h2>Pendant Text</h2>
          <input type="text" id="pendant-text" class="text-input" placeholder="Enter text..." value="BOSS" maxlength="12">
        </section>

        <!-- Font Selection -->
        <section class="control-group">
          <h2>Font</h2>
          <select id="font-select" class="select-input">
            <option value="helvetiker">Helvetiker (Bold)</option>
            <option value="optimer">Optimer (Bold)</option>
            <option value="gentilis">Gentilis (Bold)</option>
          </select>
        </section>

        <!-- Pendant Shape -->
        <section class="control-group">
          <h2>Pendant Shape</h2>
          <div class="shape-options">
            <button class="shape-btn active" data-shape="rectangle">Rectangle</button>
            <button class="shape-btn" data-shape="rounded">Rounded</button>
            <button class="shape-btn" data-shape="circle">Circle</button>
            <button class="shape-btn" data-shape="diamond">Diamond</button>
          </div>
        </section>

        <!-- Size Controls -->
        <section class="control-group">
          <h2>Dimensions</h2>
          <label class="slider-label">
            Width <span id="width-val">80</span>mm
            <input type="range" id="pendant-width" min="40" max="160" value="80" class="slider">
          </label>
          <label class="slider-label">
            Height <span id="height-val">60</span>mm
            <input type="range" id="pendant-height" min="30" max="120" value="60" class="slider">
          </label>
          <label class="slider-label">
            Thickness <span id="thickness-val">6</span>mm
            <input type="range" id="pendant-thickness" min="2" max="15" value="6" class="slider">
          </label>
          <label class="slider-label">
            Text Depth <span id="textdepth-val">3</span>mm
            <input type="range" id="text-depth" min="1" max="10" value="3" class="slider">
          </label>
          <label class="slider-label">
            Border Width <span id="border-val">4</span>mm
            <input type="range" id="border-width" min="0" max="12" value="4" class="slider">
          </label>
        </section>

        <!-- Bail (loop) Controls -->
        <section class="control-group">
          <h2>Bail (Chain Loop)</h2>
          <label class="slider-label">
            Bail Diameter <span id="bail-val">10</span>mm
            <input type="range" id="bail-diameter" min="4" max="20" value="10" class="slider">
          </label>
          <label class="slider-label">
            Bail Thickness <span id="bailthick-val">4</span>mm
            <input type="range" id="bail-thickness" min="2" max="10" value="4" class="slider">
          </label>
        </section>

        <!-- Export -->
        <section class="control-group">
          <h2>Export</h2>
          <button id="export-btn" class="btn btn-primary btn-large">Download STL</button>
        </section>
      </aside>

      <!-- 3D Viewport -->
      <main id="viewport-container">
        <canvas id="viewport"></canvas>
        <div id="viewport-controls">
          <button id="reset-camera" class="btn btn-small" title="Reset Camera">Reset View</button>
          <button id="toggle-wireframe" class="btn btn-small" title="Toggle Wireframe">Wireframe</button>
        </div>
        <div id="loading-overlay" class="hidden">
          <div class="spinner"></div>
          <p>Generating pendant...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Three.js and dependencies from CDN (ES Module imports in app.js) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
